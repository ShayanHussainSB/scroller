name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test # headless Chrome; ubuntu-latest ships google-chrome
      - run: npm run test:slow # the same suite on a CPU four times slower; timing bugs show up here
