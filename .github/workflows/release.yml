name: Release

# Publishes a release whenever main carries a manifest version that hasn't been released yet.
# Bump the version and add a CHANGELOG section in your PR; merging it ships the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run check

      - name: Already released?
        id: v
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already released. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Chrome and Firefox packages
        if: steps.v.outputs.skip != 'true'
        run: npm run build

      - name: Release notes
        if: steps.v.outputs.skip != 'true'
        run: npm run --silent release-notes -- "${{ steps.v.outputs.version }}" > notes.md

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" dist/scroller-$v-chrome.zip dist/scroller-$v-firefox.zip --target "$GITHUB_SHA" \
            --title "Scroller $v" --notes-file notes.md --latest
