<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Reader with an inner scroll box</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 20px/1.5 Georgia, serif; }
  #box { height: 100%; overflow-y: auto; }
  article { width: 600px; margin: 0 auto; }
</style>
<div id="box"><article id="text"></article></div>
<script src="common.js"></script>
<script>
  let h = '';
  for (let i = 0; i < 40; i++) h += `<p>${paragraph()}</p>`;
  document.getElementById('text').innerHTML = h;
</script>
<script src="../stub.js"></script>
</html>
